<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a41;--mute:#5b6b80;--bg:#f3f6f9;--card:#fff;--line:#d9e1ea;--acc:#0f766e;--acc2:#0b5a54;--warn:#b45309;--ok:#15803d;--chalk:#f6c945}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--ink);color:#fff;flex-wrap:wrap}
header b{font-size:18px;flex:1}header span{color:#b9c6d6;font-size:14px}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
h2{margin:24px 0 10px;font-size:22px}h3{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0}
.card.ann{border-left:5px solid var(--chalk)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .grow{flex:1;min-width:180px}
.mute{color:var(--mute);font-size:14px}
button,.btn{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--acc2)}
button[disabled]{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.danger{background:transparent;color:#b91c1c;border:1px solid #b91c1c}
header button{background:transparent;border:1px solid #6b7f97}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:4px 0;background:#fff;color:var(--ink)}
input[type=radio]{width:auto;margin-right:8px}
label.opt{display:block;padding:6px 0}
textarea{min-height:60px}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs a{padding:8px 14px;border-radius:6px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff}
.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:#e6eef5}
.tag.done{background:var(--chalk);color:#3b2f00}.tag.todo{background:#fde8cf;color:var(--warn)}.tag.live{background:#d6f0dd;color:var(--ok)}.tag.lock{background:#e5e7eb;color:#4b5563}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.q{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0;background:#fafcfe}
.login{max-width:420px;margin:12vh auto;text-align:center}
.login input{text-align:center}
.err{color:#b91c1c}
.scroll{overflow-x:auto}
.pre{white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Loading…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,getDocs,query,where,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig,TEACHER_EMAILS,SECTION} from "./config.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ts=>ts?.toDate?ts.toDate().toLocaleString():"";
const root=$("#app");
const MIN_READ_SECONDS=30;          // students can mark a module as read only after this many seconds
const MAX_TYPES=2;                  // a test may use at most this many question types
const TYPE_LABEL={mc:"Multiple choice",tf:"True / False",short:"Short answer"};
const norm=s=>String(s??"").trim().toLowerCase().replace(/\s+/g," ");
const byNew=(x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0);
const count=x=>x.count??x.questions?.length??0;
const typesText=x=>(x.types||[]).map(t=>TYPE_LABEL[t]).join(" + ");
let me=null,qs=[];
const opened={};                    // moduleId -> time the student opened it (this session)

const shell=(body,tabs="")=>{
  root.innerHTML=`<header><b>${esc(SECTION)}</b><span>${esc(me.name)} (${me.role})</span><button id="out">Sign out</button></header><main>${tabs}${body}</main>`;
  $("#out").onclick=()=>signOut(auth);
};
const safeUrl=u=>/^https?:\/\//i.test(u)||/^[\w\-./]+$/.test(u)?u:"#";

/* ---------- Auth and account creation ---------- */
function loginView(msg=""){
  root.innerHTML=`<div class="login card"><h2>${esc(SECTION)}</h2><p class="mute">New here? Signing in with your Google account creates your student account automatically.</p><button id="g">Sign in / Create account with Google</button><p class="err">${esc(msg)}</p></div>`;
  $("#g").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>loginView(e.message));
}
function registerView(u){
  root.innerHTML=`<div class="login card"><h2>Create your account</h2>
    <p class="mute">Signed in as ${esc(u.email)}. Type your full name exactly as your teacher knows you (Last name, First name).</p>
    <input id="fn" value="${esc(u.displayName||"")}" placeholder="Last name, First name">
    <button id="reg">Create my account</button> <button class="ghost" id="no">Cancel</button><p class="err" id="re"></p></div>`;
  $("#no").onclick=()=>signOut(auth);
  $("#reg").onclick=async()=>{
    const fullName=$("#fn").value.trim();
    if(fullName.length<3)return $("#re").textContent="Please type your full name.";
    try{
      await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:fullName,fullName,email:me.email,role:"student",registered:true,createdAt:serverTimestamp(),seen:serverTimestamp()},{merge:true});
      me.name=fullName;route();
    }catch(e){$("#re").textContent="Could not save: "+e.message;}
  };
}
onAuthStateChanged(auth,async u=>{
  if(!u){me=null;return loginView();}
  const email=(u.email||"").toLowerCase();
  const role=TEACHER_EMAILS.map(e=>e.toLowerCase()).includes(email)?"teacher":"student";
  let prof=null;
  try{const s=await getDoc(doc(db,"users",u.uid));prof=s.exists()?s.data():null;}catch(e){console.error(e)}
  me={uid:u.uid,name:prof?.fullName||u.displayName||email,email,role};
  if(role==="student"&&!prof?.registered)return registerView(u);
  try{await setDoc(doc(db,"users",u.uid),{uid:u.uid,name:me.name,email,role,seen:serverTimestamp()},{merge:true});}catch(e){console.error(e)}
  route();
});
window.addEventListener("hashchange",()=>me&&route());

async function route(){
  const h=location.hash.replace(/^#\/?/,"").split("/");
  try{
    if(me.role==="teacher"){
      if(h[0]==="results")return await tResults(h[1]);
      if(h[0]==="modules")return await tModules();
      if(h[0]==="announcements")return await tAnnounce();
      if(h[0]==="students")return await tStudents();
      return await tTests();
    }
    if(h[0]==="test")return await sTest(h[1]);
    return await sHome();
  }catch(e){shell(`<div class="card err">Something went wrong: ${esc(e.message)}</div>`);}
}

/* ---------- Student ---------- */
async function sHome(){
  const [a,m,t,s,r]=await Promise.all([
    getDocs(collection(db,"announcements")),
    getDocs(collection(db,"modules")),
    getDocs(query(collection(db,"tests"),where("published","==",true))),
    getDocs(query(collection(db,"scores"),where("uid","==",me.uid))),
    getDocs(query(collection(db,"reads"),where("uid","==",me.uid)))
  ]);
  const anns=a.docs.map(d=>({id:d.id,...d.data()})).sort(byNew).slice(0,5);
  const read=new Set();r.forEach(d=>read.add(d.data().moduleId));
  const sc={};s.forEach(d=>sc[d.data().testId]=d.data());
  const modName={},mods={};
  m.docs.forEach(d=>{const x={id:d.id,...d.data()};modName[x.id]=x.title;(mods[x.topic||"General"]??=[]).push(x)});
  const tests=t.docs.map(d=>({id:d.id,...d.data()})).sort(byNew);
  const todo=tests.filter(x=>!sc[x.id]),done=tests.filter(x=>sc[x.id]);
  const locked=x=>x.moduleId&&!read.has(x.moduleId);
  shell(`
  ${anns.length?`<h2>Announcements</h2>${anns.map(x=>`<div class="card ann"><b>${esc(x.title)}</b><div class="mute">${fmt(x.createdAt)}</div><div class="pre">${esc(x.body)}</div></div>`).join("")}`:""}
  <h2>To do</h2>
  ${todo.map(x=>`<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${esc(x.topic)} · ${count(x)} items${x.types?" · "+esc(typesText(x)):""}</div>
    ${locked(x)?`<div class="mute">Locked: read the module “${esc(modName[x.moduleId]||x.moduleTitle||"")}” first, then press “I finished reading”.</div>`:""}</div>
    ${locked(x)?`<span class="tag lock">Locked</span><button disabled>Start</button>`:`<span class="tag todo">Not yet answered</span><a class="btn" href="#/test/${x.id}">Start</a>`}</div>`).join("")||`<p class="mute">Nothing to answer right now.</p>`}
  <h2>Completed</h2>
  ${done.map(x=>`<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${esc(x.topic)}</div></div><span class="tag done">${sc[x.id].score} / ${sc[x.id].total}</span></div>`).join("")||`<p class="mute">No completed activities yet.</p>`}
  <h2>Modules and learning activity sheets</h2>
  ${Object.keys(mods).sort().map(k=>`<div class="card"><h3>${esc(k)}</h3>${mods[k].map(x=>`<div class="row" style="margin:8px 0"><div class="grow"><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener" data-open="${x.id}">${esc(x.title)}</a><div class="mute">${esc(x.desc)}</div></div>
    ${read.has(x.id)?`<span class="tag done">Read ✓</span>`:`<span class="tag todo">Not yet read</span><button class="ghost" data-read="${x.id}">I finished reading</button>`}</div>`).join("")}</div>`).join("")||`<p class="mute">No modules posted yet.</p>`}`);
  document.querySelectorAll("[data-open]").forEach(a=>a.addEventListener("click",()=>{opened[a.dataset.open]??=Date.now();}));
  document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.read,t0=opened[id];
    if(!t0)return alert("Open the module first and read it.");
    const left=Math.ceil(MIN_READ_SECONDS-(Date.now()-t0)/1000);
    if(left>0)return alert(`Please finish reading first. You can mark it as read in ${left} seconds.`);
    try{await setDoc(doc(db,"reads",id+"_"+me.uid),{moduleId:id,uid:me.uid,name:me.name,email:me.email,readAt:serverTimestamp()});route();}
    catch(e){alert("Could not save: "+e.message);}
  });
}

async function sTest(id){
  const snap=await getDoc(doc(db,"tests",id));
  if(!snap.exists()||!snap.data().published)return shell(`<div class="card">This test is not available. <a href="#/">Back</a></div>`);
  const prev=await getDoc(doc(db,"scores",id+"_"+me.uid));
  if(prev.exists())return shell(`<div class="card">You already answered this test. Score: <b>${prev.data().score} / ${prev.data().total}</b>. <a href="#/">Back</a></div>`);
  const t=snap.data();
  const lockCard=`<div class="card">This test is locked. Open and read the module${t.moduleTitle?` “${esc(t.moduleTitle)}”`:""} first, then press “I finished reading”. <a href="#/">Back</a></div>`;
  if(t.moduleId){const r=await getDoc(doc(db,"reads",t.moduleId+"_"+me.uid));if(!r.exists())return shell(lockCard);}
  let questions;
  try{const c=await getDoc(doc(db,"tests",id,"content","main"));questions=c.exists()?c.data().questions:t.questions;}
  catch(e){return shell(lockCard);}
  if(!questions)return shell(`<div class="card">This test has no questions. <a href="#/">Back</a></div>`);
  shell(`<h2>${esc(t.title)}</h2><p class="mute">${esc(t.topic)}. You can submit only once.</p>
  ${questions.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b><div>${
    q.type==="mc"?q.choices.map((c,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${"ABCD"[j]}">${"ABCD"[j]}. ${esc(c)}</label>`).join(""):
    q.type==="tf"?["True","False"].map(c=>`<label class="opt"><input type="radio" name="q${i}" value="${c}">${c}</label>`).join(""):
    `<input name="q${i}" placeholder="Your answer">`}</div></div>`).join("")}
  <button id="sub">Submit answers</button> <a href="#/">Cancel</a>`);
  $("#sub").onclick=async()=>{
    if(!confirm("Submit your answers? You cannot change them afterwards."))return;
    let score=0;const answers=[];
    questions.forEach((q,i)=>{
      const el=q.type==="short"?document.querySelector(`[name=q${i}]`):document.querySelector(`[name=q${i}]:checked`);
      const v=(el?.value||"").trim();answers.push(v);
      const ok=q.type==="short"?String(q.answer).split("|").some(a=>norm(a)===norm(v)):norm(v)===norm(q.answer);
      if(v&&ok)score++;
    });
    try{
      await setDoc(doc(db,"scores",id+"_"+me.uid),{testId:id,uid:me.uid,name:me.name,email:me.email,score,total:questions.length,answers,submittedAt:serverTimestamp()});
    }catch(e){return alert("Could not submit: "+e.message);}
    const pct=Math.round(score/questions.length*100);
    shell(`<div class="card"><h2>Submitted</h2><p style="font-size:22px">Your score: <b>${score} / ${questions.length}</b> (${pct}%)</p><a class="btn" href="#/">Back to dashboard</a></div>`);
  };
}

/* ---------- Teacher ---------- */
const tabs=on=>`<div class="tabs">${[["","Tests"],["modules","Modules"],["announcements","Announcements"],["students","Students"]].map(([h,l])=>`<a href="#/${h}" class="${on===h?"on":""}">${l}</a>`).join("")}</div>`;

function parseTest(txt){
  const out=[];let c=null,m;
  for(let l of txt.split(/\r?\n/)){
    l=l.trim();if(!l)continue;
    if(m=l.match(/^(\d+)[.)]\s*(.*)/)){c={type:"short",q:m[2],choices:[],answer:""};out.push(c);}
    else if(!c)continue;
    else if(m=l.match(/^([A-Da-d])[.)]\s*(.*)/)){c.choices.push(m[2]);c.type="mc";}
    else if(m=l.match(/^(?:answer|ans)\s*[:\-]\s*(.*)/i)){c.answer=m[1].trim();}
    else c.q+=" "+l;
  }
  out.forEach(q=>{
    if(q.type==="mc"){
      if(q.choices.length===2&&/^true$/i.test(q.choices[0])&&/^false$/i.test(q.choices[1])){
        q.answer=/^(a|true)$/i.test(q.answer)?"True":"False";q.type="tf";q.choices=[];
      }else{q.answer=q.answer.toUpperCase().charAt(0);while(q.choices.length<4)q.choices.push("");}
    }else if(/^(true|false)$/i.test(q.answer)){q.type="tf";q.answer=/^t/i.test(q.answer)?"True":"False";}
  });
  return out;
}

const qcard=(q,i)=>`<div class="q" data-i="${i}">
  <div class="row"><select data-f="type" class="grow">${Object.entries(TYPE_LABEL).map(([v,l])=>`<option value="${v}" ${q.type===v?"selected":""}>${l}</option>`).join("")}</select><button class="danger" data-x>Remove</button></div>
  <textarea data-f="q" placeholder="Question ${i+1}">${esc(q.q)}</textarea>
  ${q.type==="mc"?q.choices.map((c,j)=>`<input data-c="${j}" value="${esc(c)}" placeholder="Choice ${"ABCD"[j]}">`).join("")+`<input data-f="answer" value="${esc(q.answer)}" placeholder="Correct letter (A, B, C or D)">`:""}
  ${q.type==="tf"?`<select data-f="answer"><option ${q.answer==="True"?"selected":""}>True</option><option ${q.answer==="False"?"selected":""}>False</option></select>`:""}
  ${q.type==="short"?`<input data-f="answer" value="${esc(q.answer)}" placeholder="Correct answer (use | between accepted answers; capital letters ignored)">`:""}
</div>`;
const typeNote=()=>{
  const u=[...new Set(qs.map(q=>q.type))];
  const el=$("#tn");if(!el)return;
  el.textContent=u.length?`Types used: ${u.map(t=>TYPE_LABEL[t]).join(", ")} (${u.length} of ${MAX_TYPES} allowed)`:`A test can use at most ${MAX_TYPES} question types.`;
  el.className=u.length>MAX_TYPES?"err":"mute";
};
const drawQ=()=>{$("#ql").innerHTML=qs.map(qcard).join("");typeNote();};
const blank=()=>({type:"mc",q:"",choices:["","","",""],answer:""});

async function tTests(){
  const [t,s,m]=await Promise.all([getDocs(collection(db,"tests")),getDocs(collection(db,"scores")),getDocs(collection(db,"modules"))]);
  const cnt={};s.forEach(d=>{const k=d.data().testId;cnt[k]=(cnt[k]||0)+1});
  const tests=t.docs.map(d=>({id:d.id,...d.data()})).sort(byNew);
  const mods=m.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.topic||"").localeCompare(b.topic||""));
  qs=[];
  shell(`
  <h2>Tests</h2>
  ${tests.map(x=>`<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${esc(x.topic)} · ${count(x)} items${x.types?" · "+esc(typesText(x)):""} · ${cnt[x.id]||0} submitted${x.moduleTitle?` · needs module: ${esc(x.moduleTitle)}`:""}</div></div>
    <span class="tag ${x.published?"live":""}">${x.published?"Posted":"Draft"}</span>
    <button class="ghost" data-pub="${x.id}" data-v="${x.published}">${x.published?"Unpost":"Post to students"}</button>
    <a class="btn" href="#/results/${x.id}">Scores</a>
    <button class="danger" data-del="${x.id}">Delete</button></div>`).join("")||`<p class="mute">No tests yet. Create one below.</p>`}
  <h2>Create a test</h2>
  <div class="card">
    <input id="tt" placeholder="Test title"><input id="tp" placeholder="Topic (for example, Normal Distribution)">
    <label class="mute">Students must read this module before the test unlocks
      <select id="tm"><option value="">No module required</option>${mods.map(x=>`<option value="${x.id}">${esc(x.topic||"General")}: ${esc(x.title)}</option>`).join("")}</select></label>
    <label class="mute">Upload a ready-made test (.docx or .txt, see the format in README) <input type="file" id="tf" accept=".txt,.docx"></label>
    <div id="ql"></div>
    <p id="tn" class="mute"></p>
    <div class="row"><button class="ghost" id="aq">Add question</button><button id="sv">Save test</button></div>
    <p class="mute" id="st"></p>
  </div>`,tabs(""));
  drawQ();
  document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"tests",b.dataset.pub),{published:b.dataset.v!=="true"});route();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this test? Scores stay in the database."))return;
    try{await deleteDoc(doc(db,"tests",b.dataset.del,"content","main"));}catch(e){}
    await deleteDoc(doc(db,"tests",b.dataset.del));route();
  });
  $("#aq").onclick=()=>{qs.push(blank());drawQ();};
  const ql=$("#ql");
  ql.addEventListener("input",e=>{const i=+e.target.closest(".q").dataset.i;if(e.target.dataset.f==="type")return;
    if(e.target.dataset.f)qs[i][e.target.dataset.f]=e.target.value;else if(e.target.dataset.c)qs[i].choices[+e.target.dataset.c]=e.target.value;});
  ql.addEventListener("change",e=>{const i=+e.target.closest(".q").dataset.i;
    if(e.target.dataset.f==="type"){const q=qs[i];q.type=e.target.value;q.answer=q.type==="tf"?"True":"";if(q.type==="mc"&&!q.choices.length)q.choices=["","","",""];drawQ();}});
  ql.addEventListener("click",e=>{if(e.target.dataset.x!==undefined){qs.splice(+e.target.closest(".q").dataset.i,1);drawQ();}});
  $("#tf").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const txt=f.name.toLowerCase().endsWith(".docx")?(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value:await f.text();
      const got=parseTest(txt);qs=qs.concat(got);drawQ();
      const nt=new Set(qs.map(q=>q.type)).size;
      $("#st").textContent=!got.length?"No questions found. Check the file format in the README.":
        nt>MAX_TYPES?`Added ${got.length} questions, but the test now has ${nt} question types. Change some so only ${MAX_TYPES} types remain, then save.`:
        `Added ${got.length} questions. Check the answers, then save.`;
      if(!$("#tt").value)$("#tt").value=f.name.replace(/\.\w+$/,"");
    }catch(err){$("#st").textContent="Could not read the file: "+err.message;}
  };
  $("#sv").onclick=async()=>{
    const title=$("#tt").value.trim(),topic=$("#tp").value.trim(),moduleId=$("#tm").value;
    if(!title)return $("#st").textContent="Add a test title.";
    if(!qs.length)return $("#st").textContent="Add at least one question.";
    const bad=qs.findIndex(q=>!q.q.trim()||!String(q.answer).trim()||(q.type==="mc"&&q.choices.some(c=>!c.trim())));
    if(bad>=0)return $("#st").textContent=`Question ${bad+1} is missing its text, choices or correct answer.`;
    const types=[...new Set(qs.map(q=>q.type))];
    if(types.length>MAX_TYPES)return $("#st").textContent=`A test can use at most ${MAX_TYPES} question types. This one has ${types.length}.`;
    const clean=qs.map(q=>({type:q.type,q:q.q.trim(),choices:q.type==="mc"?q.choices:[],answer:q.type==="mc"?q.answer.trim().toUpperCase():q.answer.trim()}));
    const mod=mods.find(x=>x.id===moduleId);
    try{
      const ref=await addDoc(collection(db,"tests"),{title,topic,moduleId,moduleTitle:mod?mod.title:"",count:clean.length,types,published:false,createdAt:serverTimestamp()});
      await setDoc(doc(db,"tests",ref.id,"content","main"),{questions:clean});
    }catch(err){return $("#st").textContent="Could not save: "+err.message;}
    route();
  };
}

async function tResults(id){
  const [t,s,u]=await Promise.all([getDoc(doc(db,"tests",id)),getDocs(query(collection(db,"scores"),where("testId","==",id))),getDocs(query(collection(db,"users"),where("role","==","student")))]);
  if(!t.exists())return shell(`<div class="card">Test not found.</div>`,tabs(""));
  const sub=s.docs.map(d=>d.data()).sort((a,b)=>a.name.localeCompare(b.name));
  const ids=new Set(sub.map(x=>x.uid));
  const pending=u.docs.map(d=>d.data()).filter(x=>!ids.has(x.uid)).sort((a,b)=>a.name.localeCompare(b.name));
  const avg=sub.length?(sub.reduce((a,x)=>a+x.score,0)/sub.length).toFixed(1):"–";
  shell(`<p><a href="#/">← Tests</a></p><h2>${esc(t.data().title)}</h2>
  <p class="mute">${sub.length} done · ${pending.length} not yet · average ${avg} / ${count(t.data())}</p>
  <div class="card scroll"><h3>Done</h3><table><tr><th>Student</th><th>Email</th><th>Score</th><th>Submitted</th></tr>
  ${sub.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.score} / ${x.total}</td><td>${fmt(x.submittedAt)}</td></tr>`).join("")||`<tr><td colspan="4" class="mute">No submissions yet.</td></tr>`}</table></div>
  <div class="card scroll"><h3>Not yet done</h3><table>${pending.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td></tr>`).join("")||`<tr><td class="mute">Everyone who has signed in has submitted.</td></tr>`}</table></div>
  <button class="ghost" id="csv">Download scores (CSV)</button>`,tabs(""));
  $("#csv").onclick=()=>{
    const rows=[["Name","Email","Score","Total"],...sub.map(x=>[x.name,x.email,x.score,x.total])];
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"}));
    a.download=t.data().title+"-scores.csv";a.click();
  };
}

async function tModules(){
  const [m,r]=await Promise.all([getDocs(collection(db,"modules")),getDocs(collection(db,"reads"))]);
  const rc={};r.forEach(d=>{const k=d.data().moduleId;rc[k]=(rc[k]||0)+1});
  const list=m.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.topic||"").localeCompare(b.topic||""));
  shell(`<h2>Modules and learning activity sheets</h2>
  ${list.map(x=>`<div class="card row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${esc(x.topic)} · ${esc(x.url)} · read by ${rc[x.id]||0} student(s)</div></div><button class="danger" data-del="${x.id}">Remove</button></div>`).join("")||`<p class="mute">No modules yet.</p>`}
  <div class="card"><h3>Add a module</h3>
    <input id="mt" placeholder="Title (for example, LAS 1: Normal Curve)"><input id="mp" placeholder="Topic">
    <input id="mu" placeholder="Link or file path (Drive/PDF link, or las/lesson1.pdf from this repo)"><input id="md" placeholder="Short description (optional)">
    <button id="ma">Add module</button> <span class="err" id="me"></span>
    <p class="mute">After adding a module, go to Tests and choose it under “Students must read this module” so the test stays locked until they read it.</p></div>`,tabs("modules"));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Remove this module? Tests that required it will no longer be locked."))return;
    const id=b.dataset.del;
    const lt=await getDocs(query(collection(db,"tests"),where("moduleId","==",id)));
    for(const d of lt.docs)await updateDoc(d.ref,{moduleId:"",moduleTitle:""});
    await deleteDoc(doc(db,"modules",id));route();
  });
  $("#ma").onclick=async()=>{
    const title=$("#mt").value.trim(),url=$("#mu").value.trim();
    if(!title||!url)return $("#me").textContent="Title and link are required.";
    await addDoc(collection(db,"modules"),{title,topic:$("#mp").value.trim()||"General",url,desc:$("#md").value.trim(),createdAt:serverTimestamp()});
    route();
  };
}

async function tAnnounce(){
  const a=await getDocs(collection(db,"announcements"));
  const list=a.docs.map(d=>({id:d.id,...d.data()})).sort(byNew);
  shell(`<h2>Announcements</h2>
  <div class="card"><h3>Post an announcement</h3>
    <input id="at" placeholder="Title"><textarea id="ab" placeholder="Message to the class" style="min-height:100px"></textarea>
    <button id="ap">Post</button> <span class="err" id="ae"></span></div>
  ${list.map(x=>`<div class="card ann"><div class="row"><div class="grow"><b>${esc(x.title)}</b><div class="mute">${fmt(x.createdAt)}</div></div><button class="danger" data-del="${x.id}">Delete</button></div><div class="pre">${esc(x.body)}</div></div>`).join("")||`<p class="mute">No announcements yet.</p>`}`,tabs("announcements"));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete this announcement?")){await deleteDoc(doc(db,"announcements",b.dataset.del));route();}});
  $("#ap").onclick=async()=>{
    const title=$("#at").value.trim(),body=$("#ab").value.trim();
    if(!title||!body)return $("#ae").textContent="Add a title and a message.";
    await addDoc(collection(db,"announcements"),{title,body,createdAt:serverTimestamp()});
    route();
  };
}

async function tStudents(){
  const [u,r,s,t,m]=await Promise.all([
    getDocs(query(collection(db,"users"),where("role","==","student"))),
    getDocs(collection(db,"reads")),getDocs(collection(db,"scores")),
    getDocs(query(collection(db,"tests"),where("published","==",true))),getDocs(collection(db,"modules"))]);
  const rc={},sc={};
  r.forEach(d=>{const k=d.data().uid;rc[k]=(rc[k]||0)+1});
  s.forEach(d=>{const k=d.data().uid;sc[k]=(sc[k]||0)+1});
  const list=u.docs.map(d=>d.data()).sort((a,b)=>a.name.localeCompare(b.name));
  shell(`<h2>Students (${list.length})</h2><p class="mute">Students appear here as soon as they create their account with Google.</p>
  <div class="card scroll"><table><tr><th>Name</th><th>Email</th><th>Modules read</th><th>Tests done</th><th>Last seen</th></tr>
  ${list.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${rc[x.uid]||0} / ${m.size}</td><td>${sc[x.uid]||0} / ${t.size}</td><td>${fmt(x.seen)}</td></tr>`).join("")||`<tr><td class="mute">No students yet.</td></tr>`}</table></div>`,tabs("students"));
}
</script>
